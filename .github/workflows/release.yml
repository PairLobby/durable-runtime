name: Release

# Every merge to main runs the tests. Then it reads the version ssmver keeps in
# ssmver.toml and bumps from commit prefixes (feature: minor, fix: patch, release:
# major). When npm does not have @pairlobby/durable-runtime at that version, this
# publishes it and tags the merged commit v<version>. A merge that does not bump the
# version (chore:) publishes nothing. Needs the NPM_TOKEN secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  # Lets npm record which commit and workflow built the package.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the relay bundles
        run: npm run check
      - name: Find whether this version is on npm
        id: version
        if: github.event_name != 'pull_request'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' ssmver.toml)
          package=$(node -p "require('./package.json').version")
          if [ -z "$version" ] || [ "$version" != "$package" ]; then
            echo "::error::ssmver.toml is at '$version' but package.json is at '$package'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if found=$(npm view "@pairlobby/durable-runtime@$version" version 2>npm-view.log); then
            if [ "$found" = "$version" ]; then
              echo "$version is already on npm; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q E404 npm-view.log; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.log
            echo "::error::Could not ask npm whether $version is published"
            exit 1
          fi
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set, so $VERSION was not published. Add it and re-run this workflow."
            exit 1
          fi
          # A prerelease (0.2.0-beta.1) must not become what a plain `npm install` gets.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --access public --tag "$tag"
      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "durable-runtime $VERSION" --generate-notes $prerelease
